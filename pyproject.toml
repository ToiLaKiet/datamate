[project]
name = "datamate"
version = "0.1.0"
description = "Offline question answering over structured business data"
requires-python = ">=3.12,<3.13"
dependencies = ["duckdb>=1.4", "openpyxl>=3.1", "sqlglot>=27"]

[dependency-groups]
mlx = ["mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]
cuda = ["vllm>=0.11; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
